name: Release NuGet Package

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  test-library:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test Tests  
  
  create-package:
    runs-on: ubuntu-latest
    needs: test-library
    
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история для MinVer
          fetch-depth: 0
  
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
    
      - name: Create package
        run: dotnet pack Library -o ./nupkg  

      - name: Push to GitHub
        run: dotnet nuget push ./nupkg/*.nupkg -s "https://nuget.pkg.github.com/resnyanskiy/index.json" -k ${{ secrets.GITHUB_TOKEN }}
  
  test-package:
    runs-on: ubuntu-latest
    needs: create-package

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Authenticate to GitHub Packages
        run: dotnet nuget add source --username resnyanskiy --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/resnyanskiy/index.json"

      - name: Restore dependencies
        run: dotnet restore Tests -p:Configuration=Release

      - name: Run tests
        run: dotnet test Tests -c Release --no-restore

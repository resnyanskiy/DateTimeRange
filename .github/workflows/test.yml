name: Run Tests

on: [ push, pull_request ]

jobs:
  test:
    runs-on: linux
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Run tests
      run: dotnet test ./Tests --verbosity normal